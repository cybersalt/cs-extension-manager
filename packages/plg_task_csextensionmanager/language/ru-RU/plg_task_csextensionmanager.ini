PLG_TASK_CSEXTENSIONMANAGER="Задача - Cybersalt Extension Manager"
PLG_TASK_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>От <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Добавляет запланированную задачу, которая проверяет обновления расширений Cybersalt, может устанавливать их за вас и присылает сводку по email."
PLG_TASK_CSEXTENSIONMANAGER_CHECK_TITLE="Cybersalt Extension Manager: проверка обновлений"
PLG_TASK_CSEXTENSIONMANAGER_CHECK_DESC="Проверяет на cybersalt.com обновления расширений Cybersalt на этом сайте, при необходимости устанавливает их и присылает сводку по email."
PLG_TASK_CSEXTENSIONMANAGER_MODE_LABEL="Устанавливать обновления"
PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="Что делать, когда найдены обновления. Номера версий записываются как мажорная.минорная.исправление: выпуск-исправление (1.2.3 → 1.2.4) содержит только исправления, минорный добавляет функции, мажорный может изменить принцип работы."
PLG_TASK_CSEXTENSIONMANAGER_MODE_NOTIFY="Нет, только уведомить"
PLG_TASK_CSEXTENSIONMANAGER_MODE_PATCH="Только выпуски-исправления (1.2.3 → 1.2.4)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_MINOR="Исправления и минорные выпуски (1.2.3 → 1.3.0)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_ALL="Все обновления, включая мажорные выпуски"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_LABEL="Присылать сводку по email"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_DESC="Получатели задаются в параметрах Extension Manager (вкладка «Обновления»). Если адресов там нет, письмо получают суперпользователи, которым включена отправка системных писем."
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_CHANGES="Когда что-то изменилось или появилось новое"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_ALWAYS="При каждом запуске"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_NEVER="Никогда"
PLG_TASK_CSEXTENSIONMANAGER_NOTE="Extension Manager никогда не обновляет себя запланированной задачей (обновляйте его на его собственном экране), пропускает всё, что указано в Параметры → Обновления → Не обновлять автоматически, и пропускает обновления, которые не поддерживаются версией Joomla или PHP этого сайта. Каждый запуск записывается в историю Extension Manager."
