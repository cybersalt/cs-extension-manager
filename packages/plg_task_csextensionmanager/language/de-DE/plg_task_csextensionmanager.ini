PLG_TASK_CSEXTENSIONMANAGER="Aufgabe - Cybersalt Extension Manager"
PLG_TASK_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>Von <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Fügt eine geplante Aufgabe hinzu, die nach Updates für Cybersalt-Erweiterungen sucht, sie auf Wunsch für Sie installiert und eine Zusammenfassung per E-Mail sendet."
PLG_TASK_CSEXTENSIONMANAGER_CHECK_TITLE="Cybersalt Extension Manager: Nach Updates suchen"
PLG_TASK_CSEXTENSIONMANAGER_CHECK_DESC="Sucht bei cybersalt.com nach Updates für die Cybersalt-Erweiterungen auf dieser Website, installiert sie auf Wunsch und sendet eine Zusammenfassung per E-Mail."
PLG_TASK_CSEXTENSIONMANAGER_MODE_LABEL="Updates installieren"
PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="Was geschehen soll, wenn Updates gefunden werden. Versionsnummern haben die Form Major.Minor.Patch: Eine Patch-Version (1.2.3 → 1.2.4) enthält nur Fehlerkorrekturen, eine Minor-Version bringt neue Funktionen, eine Major-Version kann die Arbeitsweise ändern."
PLG_TASK_CSEXTENSIONMANAGER_MODE_NOTIFY="Nein, nur benachrichtigen"
PLG_TASK_CSEXTENSIONMANAGER_MODE_PATCH="Nur Patch-Versionen (1.2.3 → 1.2.4)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_MINOR="Patch- und Minor-Versionen (1.2.3 → 1.3.0)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_ALL="Alle Updates, auch Major-Versionen"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_LABEL="Zusammenfassung per E-Mail senden"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_DESC="Wer sie erhält, legen Sie in den Optionen des Extension Managers fest (Reiter „Updates“). Ohne Adressen dort erhalten sie die Super User, die System-E-Mails empfangen."
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_CHANGES="Wenn sich etwas geändert hat oder neu verfügbar ist"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_ALWAYS="Bei jedem Lauf"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_NEVER="Nie"
PLG_TASK_CSEXTENSIONMANAGER_NOTE="Der Extension Manager aktualisiert sich nie selbst über eine geplante Aufgabe (aktualisieren Sie ihn auf seinem eigenen Bildschirm), überspringt alles, was unter Optionen → Updates → „Nie automatisch aktualisieren“ aufgeführt ist, und überspringt Updates, die die Joomla- oder PHP-Version dieser Website nicht ausführen kann. Jeder Lauf wird im Verlauf des Extension Managers festgehalten."
