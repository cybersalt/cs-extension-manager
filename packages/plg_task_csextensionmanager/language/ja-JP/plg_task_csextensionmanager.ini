PLG_TASK_CSEXTENSIONMANAGER="タスク - Cybersalt Extension Manager"
PLG_TASK_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>提供元: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a></strong> Cybersalt エクステンションのアップデートを確認し、必要に応じて自動でインストールし、サマリーをメールで送信するスケジュールタスクを追加します。"
PLG_TASK_CSEXTENSIONMANAGER_CHECK_TITLE="Cybersalt Extension Manager: アップデートを確認"
PLG_TASK_CSEXTENSIONMANAGER_CHECK_DESC="cybersalt.com でこのサイトの Cybersalt エクステンションのアップデートを確認し、必要に応じてインストールして、サマリーをメールで送信します。"
PLG_TASK_CSEXTENSIONMANAGER_MODE_LABEL="アップデートをインストール"
PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="アップデートが見つかったときの動作です。バージョン番号は メジャー.マイナー.パッチ の形式です。パッチリリース (1.2.3 → 1.2.4) は修正のみ、マイナーリリースは機能追加を含み、メジャーリリースは動作が変わる場合があります。"
PLG_TASK_CSEXTENSIONMANAGER_MODE_NOTIFY="いいえ、通知のみ"
PLG_TASK_CSEXTENSIONMANAGER_MODE_PATCH="パッチリリースのみ (1.2.3 → 1.2.4)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_MINOR="パッチとマイナーリリース (1.2.3 → 1.3.0)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_ALL="メジャーリリースを含むすべてのアップデート"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_LABEL="サマリーをメールで送信"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_DESC="送信先は Extension Manager のオプション (アップデートタブ) で設定します。そこにアドレスがない場合は、システムメールを受信するスーパーユーザーに送信されます。"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_CHANGES="変更があったとき、または新しいものがあるとき"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_ALWAYS="実行のたびに"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_NEVER="送信しない"
PLG_TASK_CSEXTENSIONMANAGER_NOTE="Extension Manager はスケジュールタスクから自分自身をアップデートすることはありません (専用の画面からアップデートしてください)。オプション → アップデート → 自動アップデートしない に登録されたものと、このサイトの Joomla または PHP のバージョンでは実行できないアップデートはスキップします。実行はすべて Extension Manager の履歴に記録されます。"
