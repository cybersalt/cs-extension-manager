PLG_TASK_CSEXTENSIONMANAGER_NOTE="Extension Manager nigdy nie aktualizuje się sam z zaplanowanego zadania (zaktualizuj go z jego własnego ekranu), pomija wszystko, co jest na liście Opcje → Aktualizacje → Nigdy nie aktualizuj automatycznie, oraz aktualizacje, których nie obsługuje wersja Joomla lub PHP tej witryny. Każde uruchomienie jest zapisywane w Historii Extension Managera."
