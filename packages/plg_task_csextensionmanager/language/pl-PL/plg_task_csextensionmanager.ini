PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="Co zrobić po znalezieniu aktualizacji. Numery wersji mają postać główna.poboczna.poprawka: wydanie poprawkowe (1.2.3 → 1.2.4) zawiera tylko poprawki błędów, wydanie poboczne dodaje funkcje, a główne może zmieniać sposób działania."
