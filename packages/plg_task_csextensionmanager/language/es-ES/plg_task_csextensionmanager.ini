PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="Qué hacer cuando se encuentran actualizaciones. Los números de versión son mayor.menor.parche: una versión de parche (1.2.3 → 1.2.4) solo corrige errores, una menor añade funciones y una mayor puede cambiar el funcionamiento."
PLG_TASK_CSEXTENSIONMANAGER_MODE_NOTIFY="No, solo avisarme"
