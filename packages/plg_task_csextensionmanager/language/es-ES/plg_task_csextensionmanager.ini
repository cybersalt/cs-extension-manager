PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_NEVER="Nunca"
PLG_TASK_CSEXTENSIONMANAGER_NOTE="Extension Manager nunca se actualiza a sí mismo desde una tarea programada (actualícelo desde su propia pantalla), omite todo lo que figure en Opciones → Actualizaciones → No actualizar nunca automáticamente, y omite las actualizaciones que la versión de Joomla o de PHP de este sitio no puede ejecutar. Cada ejecución queda registrada en el Historial de Extension Manager."
