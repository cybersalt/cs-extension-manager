PLG_TASK_CSEXTENSIONMANAGER="Εργασία - Cybersalt Extension Manager"
PLG_TASK_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>Από την <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Προσθέτει μια προγραμματισμένη εργασία που ελέγχει για ενημερώσεις επεκτάσεων της Cybersalt, μπορεί να τις εγκαταστήσει για εσάς και στέλνει email περίληψης."
PLG_TASK_CSEXTENSIONMANAGER_CHECK_TITLE="Cybersalt Extension Manager: έλεγχος για ενημερώσεις"
PLG_TASK_CSEXTENSIONMANAGER_CHECK_DESC="Ελέγχει το cybersalt.com για ενημερώσεις των επεκτάσεων της Cybersalt σε αυτόν τον ιστότοπο, προαιρετικά τις εγκαθιστά και στέλνει email περίληψης."
PLG_TASK_CSEXTENSIONMANAGER_MODE_LABEL="Εγκατάσταση ενημερώσεων"
PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="Τι να γίνει όταν βρεθούν ενημερώσεις. Οι αριθμοί έκδοσης έχουν τη μορφή major.minor.patch: μια έκδοση patch (1.2.3 → 1.2.4) έχει μόνο διορθώσεις, μια minor προσθέτει λειτουργίες, μια major μπορεί να αλλάξει τον τρόπο λειτουργίας."
PLG_TASK_CSEXTENSIONMANAGER_MODE_NOTIFY="Όχι, απλώς ενημερώστε με"
PLG_TASK_CSEXTENSIONMANAGER_MODE_PATCH="Μόνο εκδόσεις patch (1.2.3 → 1.2.4)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_MINOR="Εκδόσεις patch και minor (1.2.3 → 1.3.0)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_ALL="Όλες οι ενημερώσεις, και οι major"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_LABEL="Αποστολή email περίληψης"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_DESC="Ποιος το λαμβάνει ορίζεται στις Επιλογές του Extension Manager (καρτέλα Ενημερώσεις). Αν δεν υπάρχουν εκεί διευθύνσεις, το λαμβάνουν οι Super Users που λαμβάνουν μηνύματα συστήματος."
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_CHANGES="Όταν κάτι άλλαξε ή είναι νέο διαθέσιμο"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_ALWAYS="Σε κάθε εκτέλεση"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_NEVER="Ποτέ"
PLG_TASK_CSEXTENSIONMANAGER_NOTE="Το Extension Manager δεν ενημερώνει ποτέ τον εαυτό του από προγραμματισμένη εργασία (ενημερώστε το από τη δική του οθόνη), παραλείπει ό,τι αναγράφεται στις Επιλογές → Ενημερώσεις → Να μην ενημερώνονται ποτέ αυτόματα και παραλείπει ενημερώσεις που η έκδοση Joomla ή PHP αυτού του ιστοτόπου δεν μπορεί να τρέξει. Κάθε εκτέλεση καταγράφεται στο Ιστορικό του Extension Manager."
