PLG_TASK_CSEXTENSIONMANAGER="Task - Cybersalt Extension Manager"
PLG_TASK_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>By <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Adds a scheduled task that checks for Cybersalt extension updates, can install them for you, and emails a summary."
PLG_TASK_CSEXTENSIONMANAGER_CHECK_TITLE="Cybersalt Extension Manager: check for updates"
PLG_TASK_CSEXTENSIONMANAGER_CHECK_DESC="Checks cybersalt.com for updates to the Cybersalt extensions on this site, optionally installs them, and emails a summary."
PLG_TASK_CSEXTENSIONMANAGER_MODE_LABEL="Install updates"
PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="What to do when updates are found. Version numbers are major.minor.patch: a patch release (1.2.3 → 1.2.4) is fixes only, a minor release adds features, a major one may change how things work."
PLG_TASK_CSEXTENSIONMANAGER_MODE_NOTIFY="No, just let me know"
PLG_TASK_CSEXTENSIONMANAGER_MODE_PATCH="Patch releases only (1.2.3 → 1.2.4)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_MINOR="Patch and minor releases (1.2.3 → 1.3.0)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_ALL="All updates, including major releases"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_LABEL="Email a summary"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_DESC="Who gets it is set in the Extension Manager's Options (Updates tab). Without addresses there, Super Users who receive system emails get it."
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_CHANGES="When something changed or is newly available"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_ALWAYS="Every run"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_NEVER="Never"
PLG_TASK_CSEXTENSIONMANAGER_NOTE="The Extension Manager never updates itself from a scheduled task (update it from its own screen), skips anything listed under Options → Updates → Never auto-update, and skips updates this site's Joomla or PHP version can't run. Every run is recorded in the Extension Manager's History."
