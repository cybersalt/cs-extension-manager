PLG_TASK_CSEXTENSIONMANAGER="Tâche - Cybersalt Extension Manager"
PLG_TASK_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>Par <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Ajoute une tâche planifiée qui recherche les mises à jour des extensions Cybersalt, peut les installer pour vous et envoie un e-mail de synthèse."
PLG_TASK_CSEXTENSIONMANAGER_CHECK_TITLE="Cybersalt Extension Manager : rechercher des mises à jour"
PLG_TASK_CSEXTENSIONMANAGER_CHECK_DESC="Recherche sur cybersalt.com les mises à jour des extensions Cybersalt de ce site, les installe si vous le souhaitez, et envoie un e-mail de synthèse."
PLG_TASK_CSEXTENSIONMANAGER_MODE_LABEL="Installer les mises à jour"
PLG_TASK_CSEXTENSIONMANAGER_MODE_DESC="Que faire quand des mises à jour sont trouvées. Les numéros de version sont de la forme majeure.mineure.correctif : une version corrective (1.2.3 → 1.2.4) ne contient que des corrections, une version mineure ajoute des fonctionnalités, une version majeure peut changer le fonctionnement."
PLG_TASK_CSEXTENSIONMANAGER_MODE_NOTIFY="Non, prévenez-moi seulement"
PLG_TASK_CSEXTENSIONMANAGER_MODE_PATCH="Versions correctives uniquement (1.2.3 → 1.2.4)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_MINOR="Versions correctives et mineures (1.2.3 → 1.3.0)"
PLG_TASK_CSEXTENSIONMANAGER_MODE_ALL="Toutes les mises à jour, y compris les versions majeures"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_LABEL="Envoyer une synthèse par e-mail"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_DESC="Les destinataires se règlent dans les Options de l'Extension Manager (onglet Mises à jour). Sans adresses à cet endroit, ce sont les Super utilisateurs qui reçoivent les e-mails système."
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_CHANGES="Quand quelque chose a changé ou est nouvellement disponible"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_ALWAYS="À chaque exécution"
PLG_TASK_CSEXTENSIONMANAGER_NOTIFY_NEVER="Jamais"
PLG_TASK_CSEXTENSIONMANAGER_NOTE="L'Extension Manager ne se met jamais à jour lui-même depuis une tâche planifiée (mettez-le à jour depuis son propre écran), ignore tout ce qui figure sous Options → Mises à jour → Ne jamais mettre à jour automatiquement, et ignore les mises à jour que la version de Joomla ou de PHP de ce site ne peut pas exécuter. Chaque exécution est enregistrée dans l'Historique de l'Extension Manager."
