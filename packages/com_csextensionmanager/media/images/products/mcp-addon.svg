<!--
  cs-mcp-for-j-addon logo — universal mark for EVERY MCP for J add-on
  Source: Tabler Icons "server" + puzzle-piece badge (MIT licensed)
  Cybersalt duotone: cobalt #0102E1 server stack, orange #FE9904 puzzle badge.

  Reads as: "the same MCP for J server — with a piece plugged into it."
  The cobalt server stack is IDENTICAL to cs-mcp-for-j.svg (shared parent identity);
  only the corner badge changes: AI-sparkle (the core extension) -> puzzle piece (an add-on).
  Deliberately ONE mark for all add-ons, so a new add-on never needs a new logo.

  Same corner-badge family-language pattern as cs-mcp-for-j, cs-articles-module-maxxed
  and cs-template-integrity.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="1200"
  viewBox="0 0 1200 1200"
  fill="none"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <g transform="scale(50)">
    <!-- Cobalt server stack: unchanged from cs-mcp-for-j.svg (the shared parent identity) -->
    <g stroke="#0102E1">
      <path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
      <path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
      <path d="M7 8l.01 0" />
      <path d="M7 16l.01 0" />
    </g>
    <!-- White knockout behind the badge for clean overlap on the top-right server corner -->
    <circle cx="18" cy="4" r="3.6" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
    <!-- Orange puzzle-piece badge: "add-on". Two outward tabs (top + right) read at small sizes. -->
    <path
      d="M15.8 1.9 H17.05 A0.95 0.95 0 0 1 18.95 1.9 H20 V3.05 A0.95 0.95 0 0 1 20 4.95 V6.1 H15.8 Z"
      stroke="#FE9904"
      stroke-width="1.1"
      fill="#FE9904"
      fill-opacity="0.18"
      stroke-linejoin="round"
    />
  </g>
</svg>
