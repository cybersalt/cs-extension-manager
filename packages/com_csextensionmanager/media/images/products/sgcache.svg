<!--
  cs-siteground-cache logo
  Source: Tabler Icons "cloud" + "bolt" composite (MIT licensed)
  Cybersalt duotone: cobalt #0102E1 cloud, orange #FE9904 bolt badge.
  Reads as: "SiteGround's cloud cache, accelerated."
  Same corner-badge family-language pattern as cs-articles-module-maxxed,
  cs-template-integrity, and cs-mcp-for-j — base icon = the thing the plugin
  works with (SG's edge cache layer); orange corner badge = the superpower
  the plugin adds (speed via cache hits instead of full Joomla page renders).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="1200"
  viewBox="0 0 1200 1200"
  fill="none"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <g transform="scale(50)">
    <g stroke="#0102E1" stroke-width="2">
      <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" />
    </g>
    <!-- White knockout behind bolt badge for clean overlap on the cloud's top-right puff -->
    <circle cx="20" cy="4" r="3.6" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
    <!-- Orange bolt badge: "cache speed" -->
    <path
      d="M20.3 1.3l0 2.1l1.8 0l-2.4 3.3l0 -2.1l-1.8 0l2.4 -3.3"
      stroke="#FE9904"
      stroke-width="1.4"
      fill="#FE9904"
      fill-opacity="0.18"
    />
  </g>
</svg>
