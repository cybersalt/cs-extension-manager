<!--
  cs-mcp-for-j logo
  Source: Tabler Icons "server" + AI-sparkle composite (MIT licensed)
  Cybersalt duotone: cobalt #0102E1 server stack, orange #FE9904 sparkle badge.
  Reads as: "your Joomla site becomes a server, with an AI (Claude) connection wired in."
  Same corner-badge family-language pattern as cs-articles-module-maxxed and cs-template-integrity.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="1200"
  viewBox="0 0 1200 1200"
  fill="none"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <g transform="scale(50)">
    <!-- Cobalt server stack: two rack-mount servers with LED indicators (Tabler server) -->
    <g stroke="#0102E1">
      <path d="M3 4m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
      <path d="M3 12m0 3a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z" />
      <path d="M7 8l.01 0" />
      <path d="M7 16l.01 0" />
    </g>
    <!-- White knockout behind sparkle badge for clean overlap on the top-right server corner -->
    <circle cx="18" cy="4" r="3.6" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
    <!-- Orange 4-point sparkle badge: AI / Claude connection -->
    <path
      d="M18 1.4 L18.7 3.3 L20.6 4 L18.7 4.7 L18 6.6 L17.3 4.7 L15.4 4 L17.3 3.3 Z"
      stroke="#FE9904"
      stroke-width="1.4"
      fill="#FE9904"
      fill-opacity="0.18"
      stroke-linejoin="round"
    />
  </g>
</svg>
