PKG_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>Par <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Installez, mettez à jour et gérez toutes les extensions Cybersalt depuis un seul écran : installations et mises à jour en un clic avec vérification des sommes de contrôle, journal des nouveautés depuis votre version, retour à n'importe quelle version antérieure, contrôles de santé avec corrections en un clic, nombre de mises à jour sur le tableau de bord d'accueil, et recherches de mises à jour planifiées avec e-mails de synthèse. Gratuit."
