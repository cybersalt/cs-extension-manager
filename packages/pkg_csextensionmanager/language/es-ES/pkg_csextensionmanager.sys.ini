PKG_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>Por <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Instale, actualice y cuide todas las extensiones de Cybersalt desde una sola pantalla: instalaciones y actualizaciones con un clic y comprobación de sumas de verificación, un registro de cambios con las novedades desde su versión, vuelta a cualquier versión anterior, comprobaciones de estado con correcciones con un clic, un contador de actualizaciones en el Panel de inicio y búsquedas programadas de actualizaciones con resúmenes por correo. Gratis."
