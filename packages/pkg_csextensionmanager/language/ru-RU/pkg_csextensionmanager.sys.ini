PKG_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>От <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Устанавливайте, обновляйте и обслуживайте все расширения Cybersalt на одном экране: установка и обновление одним щелчком с проверкой контрольных сумм, список изменений с момента вашей версии, откат к любому предыдущему выпуску, проверка состояния с исправлением в один щелчок, счётчик обновлений на главной панели и плановые проверки обновлений с письмами-сводками. Бесплатно."
