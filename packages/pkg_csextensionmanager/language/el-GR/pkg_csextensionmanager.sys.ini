PKG_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>Από την <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Εγκαταστήστε, ενημερώστε και φροντίστε όλες τις επεκτάσεις της Cybersalt από μία οθόνη: εγκαταστάσεις και ενημερώσεις με ένα κλικ και έλεγχο αθροίσματος, αρχείο αλλαγών με ό,τι νέο υπάρχει από την έκδοσή σας, επαναφορά σε οποιαδήποτε προηγούμενη έκδοση, έλεγχοι υγείας με διορθώσεις με ένα κλικ, μετρητής ενημερώσεων στην αρχική σελίδα διαχείρισης και προγραμματισμένοι έλεγχοι ενημερώσεων με email περίληψης. Δωρεάν."
