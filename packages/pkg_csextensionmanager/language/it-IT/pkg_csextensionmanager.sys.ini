PKG_CSEXTENSIONMANAGER="Cybersalt Extension Manager"
PKG_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>Di <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a>.</strong> Installi, aggiorni e gestisca tutte le estensioni Cybersalt da un'unica schermata: installazioni e aggiornamenti con un clic e verifica del checksum, un registro delle modifiche con le novità rispetto alla Sua versione, ripristino di qualsiasi versione precedente, controlli dello stato con correzioni in un clic, il conteggio degli aggiornamenti nel Pannello di controllo e controlli degli aggiornamenti pianificati con riepiloghi via email. Gratuito."
