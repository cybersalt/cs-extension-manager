PKG_CSEXTENSIONMANAGER_XML_DESCRIPTION="<strong>提供元: <a href=\"https://cybersalt.com\" target=\"_blank\" rel=\"noopener noreferrer\">Cybersalt</a></strong> Cybersalt のすべてのエクステンションを1つの画面でインストール、アップデート、管理できます。チェックサム確認付きのワンクリックインストールとアップデート、お使いのバージョン以降の変更履歴、以前のどのリリースへのロールバック、ワンクリック修正付きのヘルスチェック、ホームダッシュボードのアップデート件数表示、サマリーメール付きのスケジュールによるアップデート確認に対応しています。無料です。"
