name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: PHP syntax check
        run: find packages -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Composer dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP_CodeSniffer (PSR-12, Joomla exclusions)
        run: vendor/bin/phpcs --standard=phpcs.xml packages

  structure:
    name: Manifests, encoding, structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate XML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils > /dev/null
          find packages -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout

      - name: Validate JSON
        run: |
          python3 -m json.tool packages/com_csextensionmanager/media/joomla.asset.json > /dev/null
          python3 -m json.tool packages/com_csextensionmanager/admin/catalog/seed.json > /dev/null

      - name: No UTF-8 BOMs in PHP / XML / INI / JSON
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            if head -c 3 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^efbbbf'; then echo "BOM: $f"; bad=1; fi
          done < <(find packages -type f \( -name '*.php' -o -name '*.xml' -o -name '*.ini' -o -name '*.json' \) -print0)
          exit $bad

      - name: No empty folders (Joomla installer trips on them)
        run: |
          empty=$(find packages -type d -empty)
          if [ -n "$empty" ]; then echo "$empty"; exit 1; fi

      - name: Manifest versions agree
        run: |
          v() { grep -oP '(?<=<version>)[^<]+' "$1" | head -1; }
          p=$(v packages/pkg_csextensionmanager/pkg_csextensionmanager.xml)
          for m in packages/com_csextensionmanager/csextensionmanager.xml \
                   packages/plg_installer_csextensionmanager/csextensionmanager.xml \
                   packages/plg_quickicon_csextensionmanager/csextensionmanager.xml \
                   packages/plg_task_csextensionmanager/csextensionmanager.xml; do
            [ "$(v "$m")" = "$p" ] || { echo "$m != $p"; exit 1; }
          done

      - name: Every language key used in code is defined
        run: python3 tools/check-language.py

  unit:
    name: Unit tests (feed parsing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run tests
        run: php tests/run.php
